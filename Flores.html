<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti 🌻</title>

<style>

/* General */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}


/* Primer mensaje */

#firstMessage {

    position: fixed;
    top: 50%;
    left: 50%;
    width: 90%;
    max-width: 650px;
    transform:
        translate(-50%, -50%);

    text-align: center;

    font-family:
        "Book Antiqua",
        Georgia,
        serif;

    font-size:
        clamp(30px, 7vw, 55px);

    line-height: 1.25;

    font-weight: bold;

    color: #fff4a3;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffd700,
        0 0 25px #ffc107,
        0 0 45px #ffd700;

    z-index: 20;

    opacity: 0;

    animation:
        messageAppear 2s ease forwards,
        heartbeat 4s ease-in-out 2s infinite;
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(.7);
    }

    to {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

@keyframes heartbeat {

    0% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.04);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

#firstMessage.hide {

    animation:
        messageDisappear 1.4s ease forwards;
}

@keyframes messageDisappear {

    from {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }

    to {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1.15);
    }
}


/* Ramo */

#bouquet {

    position: fixed;
    left: 50%;
    bottom: 80px;
    width: 330px;
    height: 430px;

    transform:
        translateX(-50%)
        translateY(130px)
        scale(.75);
    opacity: 0;
    z-index: 5;
    pointer-events: none;

    transition:
        opacity 2s ease,
        transform 2.2s cubic-bezier(.2,.8,.2,1);
}

#bouquet.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0)
        scale(1);
}


/* Tallos */

.stem {

    position: absolute;
    bottom: 25px;
    left: 50%;
    width: 7px;
    background:
        linear-gradient(
            to right,
            #174d20,
            #4f9f38,
            #72bd4b,
            #245e28
        );

    border-radius: 12px;

    transform-origin: bottom;

    z-index: 1;

    box-shadow:
        0 0 5px rgba(90,190,60,.5);
}


/* TALLOS ALINEADOS CON CADA GIRASOL */

.stem {

    position: absolute;

    top: 66px;

    width: 7px;

    background:
        linear-gradient(
            to right,
            #174d20,
            #4f9f38,
            #72bd4b,
            #245e28
        );

    border-radius: 12px;

    transform-origin: top center;

    z-index: 1;

    box-shadow:
        0 0 5px rgba(90,190,60,.5);
}


/* Girasol 1 — centro superior */
.stem1 {

    left: 50%;
    height: 311px;
    transform:
    translateX(-50%)
    rotate(0deg);
}


/* Girasol 2 — superior izquierdo */
.stem2 {

    left: 24.55%;

    top: 128px;

    height: 293px;

    transform:
        translateX(-50%)
        rotate(-13deg);
}


/* Girasol 3 — superior derecho */
.stem3 {

    left: 75.45%;

    top: 128px;

    height: 293px;

    transform:
        translateX(-50%)
        rotate(13deg);
}


/* Girasol 4 — inferior izquierdo */
.stem4 {

    left: 41.82%;

    top: 184px;

    height: 237px;

    transform:
        translateX(-50%)
        rotate(-8deg);
}


/* Girasol 5 — inferior derecho */
.stem5 {

    left: 58.18%;

    top: 184px;

    height: 237px;

    transform:
        translateX(-50%)
        rotate(8deg);
}


/* Hojas */

.leaf {

    position: absolute;

    width: 55px;
    height: 25px;

    background:
        linear-gradient(
            135deg,
            #65ad42,
            #245b27
        );

    border-radius:
        100% 0 100% 0;

    z-index: 2;

    box-shadow:
        0 0 5px rgba(70,180,50,.4);
}

.leaf1 {

    bottom: 160px;
    left: 55px;

    transform:
        rotate(30deg);
}

.leaf2 {

    bottom: 150px;
    right: 50px;

    transform:
        rotate(-30deg)
        scaleX(-1);
}

.leaf3 {

    bottom: 215px;
    left: 85px;

    transform:
        rotate(40deg);
}

.leaf4 {

    bottom: 205px;
    right: 85px;

    transform:
        rotate(-40deg)
        scaleX(-1);
}


/* Flores */

.flower {

    position: absolute;
    width: 92px;
    height: 92px;
    opacity: 0;
    transform:
        scale(.2)
        rotate(-20deg);
    transition:
        opacity 1s ease,
        transform 1.3s cubic-bezier(.2,.8,.2,1);

    z-index: 6;
}

#bouquet.show .flower {
    opacity: 1;
    transform:
        scale(1)
        rotate(0deg);
}

#bouquet.show .flower5 {
    transform:
        translateX(-50%)
        scale(.92)
        rotate(0deg);
}


/* Posiciones */

.flower1 {

    top: 20px;
    left: 119px;

    transition-delay: .15s;
}

.flower2 {

    top: 82px;
    left: 35px;
    transition-delay: .35s;
}

.flower3 {

    top: 82px;
    right: 35px;
    transition-delay: .50s;
}

.flower4 {

    top: 138px;
    left: 92px;
    transition-delay: .70s;
}

.flower5 {
    top: 76px;
    left: 50%;
    width: 82px;
    height: 82px;

    transform:
        translateX(-50%)
        scale(.92);
    z-index: 4;
    transition-delay: .85s;
}


/* Pétalos */

.petal {

    position: absolute;

    width: 36px;
    height: 58px;

    left: 50%;
    top: 50%;

    margin-left: -18px;
    margin-top: -29px;

    background:
        linear-gradient(
            to bottom,
            #fff59d,
            #ffd600 60%,
            #f9a825
        );

    border-radius:
        50% 50% 45% 45%;
    transform-origin:
        center center;
    box-shadow:
        0 0 7px rgba(255,215,0,.7);
}


/*
   Los pétalos se separan desde
   el centro de la flor.
*/

.petal:nth-child(1) {

    transform:
        rotate(0deg)
        translateY(-27px);
}

.petal:nth-child(2) {

    transform:
        rotate(45deg)
        translateY(-27px);
}

.petal:nth-child(3) {

    transform:
        rotate(90deg)
        translateY(-27px);
}

.petal:nth-child(4) {

    transform:
        rotate(135deg)
        translateY(-27px);
}

.petal:nth-child(5) {

    transform:
        rotate(180deg)
        translateY(-27px);
}

.petal:nth-child(6) {

    transform:
        rotate(225deg)
        translateY(-27px);
}

.petal:nth-child(7) {

    transform:
        rotate(270deg)
        translateY(-27px);
}

.petal:nth-child(8) {

    transform:
        rotate(315deg)
        translateY(-27px);
}


/*  CENTRO DEL GIRASOL */

.center {

    position: absolute;
    width: 38px;
    height: 38px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 30% 30%,
            #8d6e63 0 4%,
            transparent 5%
        ),

        radial-gradient(
            circle at 70% 35%,
            #6d4c41 0 4%,
            transparent 5%
        ),

        radial-gradient(
            circle at 40% 70%,
            #795548 0 4%,
            transparent 5%
        ),

        radial-gradient(
            circle at 70% 75%,
            #4e342e 0 4%,
            transparent 5%
        ),

        #5d4037;

    box-shadow:

        inset 0 0 7px rgba(0,0,0,.5),

        0 0 6px #3e2723;

    z-index: 20;
}


/* Moño */

.ribbon {

    position: absolute;

    bottom: 3px;

    left: 50%;

    width: 90px;
    height: 50px;

    transform:
        translateX(-50%);

    z-index: 20;
}

.ribbon-left,
.ribbon-right {

    position: absolute;

    width: 55px;
    height: 42px;

    top: 4px;

    background:
        linear-gradient(
            135deg,
            #ff4081,
            #d81b60
        );

    box-shadow:
        0 0 7px rgba(255,64,129,.5);
}

.ribbon-left {

    right: 42px;

    border-radius:
        50% 10% 50% 10%;

    transform:
        rotate(25deg);
}

.ribbon-right {

    left: 42px;

    border-radius:
        10% 50% 10% 50%;

    transform:
        rotate(-25deg);
}

.ribbon-center {

    position: absolute;

    left: 50%;
    top: 8px;

    width: 27px;
    height: 34px;

    transform:
        translateX(-50%);

    background:
        #ec407a;

    border-radius: 7px;

    z-index: 5;
}


/* FRASE FINAL */

#secondMessage {

    position: fixed;

    left: 50%;

    bottom: 22px;

    width: 95%;

    transform:
        translateX(-50%)
        translateY(25px);

    text-align: center;

    font-family:
        "Book Antiqua",
        Georgia,
        serif;

    font-size:
        clamp(14px, 4vw, 23px);

    white-space: nowrap;

    letter-spacing: .5px;

    color: #fff3a3;

    text-shadow:
        0 0 5px #fff,
        0 0 10px #ffd700,
        0 0 18px #ffc107;

    opacity: 0;

    z-index: 30;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}

#secondMessage.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* RESPONSIVE */

@media (max-width: 600px) {

    #bouquet {

        width: 300px;

        height: 430px;

        bottom: 78px;
    }

    #firstMessage {

        width: 88%;

        font-size:
            clamp(27px, 8vw, 42px);
    }

    #secondMessage {

        width: 100%;

        font-size:
            clamp(13px, 4vw, 18px);

        white-space: nowrap;
    }
}

</style>
</head>


<body>


<!-- FONDO -->     

<canvas id="rain"></canvas>


<!-- PRIMERA FRASE -->

<div id="firstMessage">

    Para ti🌻

</div>


<!-- RAMO -->

<div id="bouquet">


    <!-- TALLOS -->

    <div class="stem stem1"></div>
    <div class="stem stem2"></div>
    <div class="stem stem3"></div>
    <div class="stem stem4"></div>
    <div class="stem stem5"></div>


    <!-- HOJAS-->

    <div class="leaf leaf1"></div>
    <div class="leaf leaf2"></div>
    <div class="leaf leaf3"></div>
    <div class="leaf leaf4"></div>


    <!-- GIRASOL 1 -->

    <div class="flower flower1">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="center"></div>

    </div>


       <!-- GIRASOL 2 -->

    <div class="flower flower2">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="center"></div>

    </div>

   <!-- GIRASOL 3 -->

    <div class="flower flower3">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="center"></div>

    </div>

   <!-- GIRASOL 4 -->

    <div class="flower flower4">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="center"></div>

    </div>


      <!-- GIRASOL 5 -->

    <div class="flower flower5">

        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>

        <div class="center"></div>

    </div>


    <!-- MOÑO -->

    <div class="ribbon">

        <div class="ribbon-left"></div>

        <div class="ribbon-right"></div>

        <div class="ribbon-center"></div>

    </div>

</div>


<!-- Frase fnl -->

<div id="secondMessage">

    Para ti, mi flor favorita 🌻💛

</div>


<!-- music -->

<audio
    id="bgMusic"
    src="Flores-amarillas.mp3"
    loop>
</audio>


<script>

/* canvas */

const canvas =
    document.getElementById("rain");

const ctx =
    canvas.getContext("2d");


function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* Lluvia de amor XD*/

const text =
    "LOVE YOU";

const fontSize =
    28;

let columns =
    Math.floor(
        canvas.width /
        fontSize
    );

let drops =
    Array.from(
        {
            length: columns
        },
        () =>
            Math.random() *
            canvas.height
    );


function drawRain() {

    ctx.font =
        fontSize +
        "px monospace";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "rgba(255,244,224,.20)";


    drops.forEach(
        (y, i) => {

            const x =
                i * fontSize +
                fontSize / 2;

            ctx.fillText(
                text,
                x,
                y
            );

            drops[i] =
                y > canvas.height &&
                Math.random() > .975
                    ? 0
                    : y +
                      fontSize * .6;
        }
    );
}


/* corazón */

const hearts = [];


function createHeart() {

    return {

        x:
            Math.random() *
            canvas.width,

        y:
            canvas.height + 30,

        size:
            13 +
            Math.random() * 15,

        speed:
            1 +
            Math.random() * 1.7,

        alpha:
            .35 +
            Math.random() * .45
    };
}


function drawHeart(
    x,
    y,
    size,
    alpha
) {

    ctx.beginPath();

    ctx.moveTo(
        x,
        y + size / 4
    );

    ctx.bezierCurveTo(
        x,
        y,
        x - size / 2,
        y,
        x - size / 2,
        y + size / 4
    );

    ctx.bezierCurveTo(
        x - size / 2,
        y + size / 2,
        x,
        y + size,
        x,
        y + size
    );

    ctx.bezierCurveTo(
        x,
        y + size,
        x + size / 2,
        y + size / 2,
        x + size / 2,
        y + size / 4
    );

    ctx.bezierCurveTo(
        x + size / 2,
        y,
        x,
        y,
        x,
        y + size / 4
    );

    ctx.fillStyle =
        `rgba(
            255,
            215,
            0,
            ${alpha}
        )`;

    ctx.shadowBlur = 10;

    ctx.shadowColor =
        "#ffd700";

    ctx.fill();

    ctx.shadowBlur = 0;
}


/* Fuegos Artificiales */

const fireworks = [];

let fireworksEnabled =
    false;


const colors = [

    "#FFD700",
    "#FFC107",
    "#FFE082",
    "#FFF8DC"

];


function hexToRgb(hex) {

    const bigint =
        parseInt(
            hex.slice(1),
            16
        );

    const r =
        (bigint >> 16) &
        255;

    const g =
        (bigint >> 8) &
        255;

    const b =
        bigint & 255;

    return `${r},${g},${b}`;
}


function createFirework() {

    const x =
        Math.random() *
        canvas.width;

    const y =
        Math.random() *
        (canvas.height * .45);

    const particles = [];


    for (
        let i = 0;
        i < 40;
        i++
    ) {

        const angle =
            Math.PI *
            2 *
            i /
            40;


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                (2 +
                Math.random() * 2),

            vy:
                Math.sin(angle) *
                (2 +
                Math.random() * 2),

            alpha: 1,

            radius:
                1.5 +
                Math.random() * 2,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ]
        });
    }

    fireworks.push({
        particles
    });
}


function drawFireworks() {

    fireworks.forEach(
        (fw, fwIndex) => {

            fw.particles.forEach(
                (p, index) => {

                    ctx.beginPath();

                    ctx.arc(
                        p.x,
                        p.y,
                        p.radius,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle =
                        `rgba(
                            ${hexToRgb(p.color)},
                            ${p.alpha}
                        )`;

                    ctx.shadowBlur = 8;

                    ctx.shadowColor =
                        p.color;

                    ctx.fill();

                    ctx.shadowBlur = 0;

                    p.x += p.vx;

                    p.y += p.vy;

                    p.alpha -= .012;

                    p.vx *= .98;

                    p.vy *= .98;


                    if (
                        p.alpha <= 0
                    ) {

                        fw.particles.splice(
                            index,
                            1
                        );
                    }
                }
            );


            if (
                fw.particles.length === 0
            ) {

                fireworks.splice(
                    fwIndex,
                    1
                );
            }
        }
    );


    if (
        fireworksEnabled &&
        Math.random() < .018
    ) {

        createFirework();
    }
}


/* ANIMACIÓN */

function draw() {

    ctx.fillStyle =
        "rgba(0,0,0,.12)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    drawRain();


    if (
        Math.random() < .08
    ) {

        hearts.push(
            createHeart()
        );
    }


    hearts.forEach(
        (heart, index) => {

            drawHeart(
                heart.x,
                heart.y,
                heart.size,
                heart.alpha
            );

            heart.y -=
                heart.speed;


            if (
                heart.y < -60
            ) {

                hearts.splice(
                    index,
                    1
                );
            }
        }
    );


    drawFireworks();
}


setInterval(
    draw,
    40
);


/* SECUENCIA */

const firstMessage =
    document.getElementById(
        "firstMessage"
    );

const bouquet =
    document.getElementById(
        "bouquet"
    );

const secondMessage =
    document.getElementById(
        "secondMessage"
    );


/*
   Primero aparece la frase.
*/

setTimeout(
    () => {

        firstMessage.classList.add(
            "hide"
        );

    },
    4000
);


/*
   Después aparece el ramo.
*/

setTimeout(
    () => {

        bouquet.classList.add(
            "show"
        );

    },
    5600
);


/*
   Finalmente aparece la frase
   debajo del ramo.
*/

setTimeout(
    () => {

        secondMessage.classList.add(
            "show"
        );

    },
    8000
);


/* MUSI EM */

const music =
    document.getElementById(
        "bgMusic"
    );

music.volume =
    .55;


setTimeout(
    () => {

        music.play().catch(
            () => {}
        );

    },
    1500
);


document.addEventListener(
    "click",
    () => {

        if (
            music.paused
        ) {

            music.play();
        }

    },
    {
        once: true
    }
);


/* FUEGOS */

setTimeout(
    () => {

        fireworksEnabled =
            true;

    },
    3000
);

</script>

</body>
</html>
