<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
        }

        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            color: #ffd700;
            font-size: 12px;
            opacity: 0.45;
            text-shadow:
                0 0 5px #ffd700,
                0 0 10px rgba(255, 215, 0, 0.4);
            animation: twinkle 3s ease-in-out infinite;
        }

        .star:nth-child(1)  { top: 10%; left: 15%; animation-delay: .3s; }
        .star:nth-child(2)  { top: 18%; left: 72%; animation-delay: 1s; }
        .star:nth-child(3)  { top: 28%; left: 38%; animation-delay: 1.8s; }
        .star:nth-child(4)  { top: 35%; left: 88%; animation-delay: .6s; }
        .star:nth-child(5)  { top: 48%; left: 12%; animation-delay: 2.2s; }
        .star:nth-child(6)  { top: 55%; left: 65%; animation-delay: .9s; }
        .star:nth-child(7)  { top: 68%; left: 30%; animation-delay: 1.5s; }
        .star:nth-child(8)  { top: 75%; left: 82%; animation-delay: 2.5s; }
        .star:nth-child(9)  { top: 85%; left: 10%; animation-delay: 1.2s; }
        .star:nth-child(10) { top: 90%; left: 55%; animation-delay: .4s; }
        .star:nth-child(11) { top: 12%; left: 48%; animation-delay: 2s; }
        .star:nth-child(12) { top: 42%; left: 50%; animation-delay: 1.1s; }
        .star:nth-child(13) { top: 62%; left: 90%; animation-delay: 2.8s; }
        .star:nth-child(14) { top: 25%; left: 8%; animation-delay: 1.7s; }
        .star:nth-child(15) { top: 78%; left: 45%; animation-delay: .8s; }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.25;
                transform: scale(0.8);
            }

            50% {
                opacity: 0.65;
                transform: scale(1.15);
            }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 18px 42px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 50px;
            font-family: Georgia, serif;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            box-shadow:
                0 0 10px rgba(255, 215, 0, 0.5),
                0 0 25px rgba(255, 215, 0, 0.25);
            cursor: pointer;
            transition:
                transform .3s ease,
                box-shadow .3s ease;
        }

        .button:hover {
            transform: scale(1.06);
            box-shadow:
                0 0 15px rgba(255, 215, 0, 0.8),
                0 0 35px rgba(255, 215, 0, 0.4);
        }

        .button:active {
            transform: scale(.96);
        }
    </style>
</head>

<body>

    <div class="stars">
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
        <span class="star">✧</span>
        <span class="star">✦</span>
    </div>

    <div class="content">
        <a href="Flores-1.html" class="button">
            Presione aquí
        </a>
    </div>

</body>
</html>
